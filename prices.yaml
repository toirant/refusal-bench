# Prices in USD per 1M tokens (paid-tier list prices, standard / non-batch).
# Entries marked "verified" were checked on the official pricing pages on 2026-10-24.
# Others remain TODO-verify (not used in the current run).
# free_tier: true means the run used a free-tier key, so actual spend is $0;
# analyze.py still reports the list-price estimate for comparison.
# cost_per_1k_prompts uses average tokens from a run; placeholders are for planning.
